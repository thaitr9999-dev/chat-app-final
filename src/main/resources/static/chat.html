<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat - Chat App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      :root{--purple:#667eea;--purple-dark:#764ba2}
      body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial;background:#f6f8fb;}
      .app{max-width:1100px;margin:18px auto;display:flex;gap:16px;padding:12px}
      .sidebar{width:260px;background:white;border-radius:12px;padding:12px;box-shadow:0 6px 18px rgba(0,0,0,0.06)}
      .main{flex:1;display:flex;flex-direction:column;gap:12px}
      .messages{flex:1;overflow-y:auto;padding:16px;background:linear-gradient(180deg,#fff,#f8f9fb);border-radius:12px}
      .msg{max-width:75%;padding:10px 14px;border-radius:14px;margin:8px 0;display:inline-block}
      .msg.me{margin-left:auto;background:linear-gradient(90deg,var(--purple),var(--purple-dark));color:white}
      .msg.other{background:white;border:1px solid #eee;color:#222}
      .meta{font-size:12px;opacity:0.8;margin-bottom:6px}
      .controls{display:flex;gap:8px}
      .connection{font-size:14px}
      @media(max-width:480px){ .app{flex-direction:column;padding:8px}.sidebar{width:100%;order:2} }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <div class="d-flex justify-content-between align-items-center mt-3 mb-2">
        <h5>Chat Dashboard</h5>
        <div>
          <span id="statusBadge" class="badge bg-secondary">Connecting...</span>
          <button id="logoutBtn" class="btn btn-outline-secondary btn-sm ms-2">Logout</button>
        </div>
      </div>

      <div class="app">
        <div class="sidebar">
          <h6>Online Users <small class="text-muted">(<span id="onlineCount">0</span>)</small></h6>
          <ul id="onlineUsers" class="list-unstyled mb-0"></ul>
        </div>

        <div class="main">
          <div class="messages" id="messages"></div>

          <div class="input-group">
            <input id="messageInput" class="form-control" placeholder="Type a message..." />
            <button id="sendBtn" class="btn btn-primary">Send</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <script>
      const token = localStorage.getItem('token');
      const currentUsername = localStorage.getItem('username');
      if(!token){ window.location.href = '/login.html'; }

      const statusBadge = document.getElementById('statusBadge');
      const messagesEl = document.getElementById('messages');
      const onlineUsersEl = document.getElementById('onlineUsers');
      const onlineCountEl = document.getElementById('onlineCount');

      function setStatus(text, cls='secondary'){
        statusBadge.innerText = text; statusBadge.className = 'badge bg-'+cls;
      }

      // Load history
      async function loadHistory(){
        try{
          const res = await fetch('/api/messages/history',{ headers:{ 'Authorization': `Bearer ${token}` }});
          if(res.ok){ const history = await res.json(); history.forEach(renderMessage); messagesEl.scrollTop = messagesEl.scrollHeight; }
        }catch(e){ console.error('History load error', e); }
      }

      // STOMP over SockJS
      let stompClient = null;
      function connectWs(){
        const socketUrl = `${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/ws?token=${token}`;
        const sock = new SockJS(socketUrl);
        stompClient = StompJs.Stomp.over(sock);
        stompClient.connect({}, frame => {
          setStatus('Connected','success');
          stompClient.subscribe('/topic/public', msg => onMessage(JSON.parse(msg.body)));
          stompClient.subscribe('/topic/online-users', msg => onUsers(JSON.parse(msg.body)));
          stompClient.subscribe('/user/queue/private', msg => onMessage(JSON.parse(msg.body)));
          // announce join
          stompClient.send('/app/chat.addUser', {}, JSON.stringify({ sender: currentUsername, type: 'JOIN' }));
        }, err => {
          console.error('STOMP error', err); setStatus('Disconnected','danger');
          setTimeout(()=>{ connectWs(); setStatus('Reconnecting...','warning'); }, 3000);
        });
      }

      function onMessage(message){
        renderMessage(message);
      }

      function onUsers(list){
        onlineUsersEl.innerHTML=''; onlineCountEl.innerText = list.length;
        list.forEach(u=>{ const li=document.createElement('li'); li.innerText = u; onlineUsersEl.appendChild(li); });
      }

      function renderMessage(m){
        const el = document.createElement('div');
        const meta = document.createElement('div'); meta.className='meta';
        meta.innerText = (m.sender||'') + (m.time ? ' • '+ new Date(m.time).toLocaleTimeString(): '');
        el.appendChild(meta);
        const txt = document.createElement('div'); txt.className='msg '+((m.sender===currentUsername)?'me':'other');
        txt.innerText = m.content || (m.type==='JOIN'?`${m.sender} joined`: m.type==='LEAVE'?`${m.sender} left`: '');
        el.appendChild(txt);
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      document.getElementById('sendBtn').addEventListener('click', sendMessage);
      document.getElementById('messageInput').addEventListener('keydown', e=>{ if(e.key==='Enter') sendMessage(); });

      function sendMessage(){
        const input = document.getElementById('messageInput'); const content = input.value.trim();
        if(!content || !stompClient) return; 
        stompClient.send('/app/chat.sendMessage', {}, JSON.stringify({ sender: currentUsername, content, type: 'CHAT' }));
        input.value='';
      }

      document.getElementById('logoutBtn').addEventListener('click', ()=>{
        localStorage.removeItem('token'); localStorage.removeItem('username'); window.location.href='/login.html';
      });

      // Init
      (function(){ loadHistory(); connectWs(); setStatus('Connecting...','secondary'); })();
    </script>
  </body>
</html>
