<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat - Chat App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      :root{--cyan:#00d4ff;--bg:#021213}
      body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial;background:linear-gradient(180deg,#001a1a,#001414);color:#e6fbff;min-height:100vh}
      .app-container{max-width:1200px;margin:0 auto;display:flex;height:calc(100vh - 80px);gap:16px;padding:12px}
      .sidebar{width:280px;background:rgba(255,255,255,0.03);border-radius:12px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,0.6);border:1px solid rgba(0,212,255,0.08);overflow-y:auto}
      .main-area{flex:1;display:flex;flex-direction:column;gap:12px}
      .messages-container{flex:1;background:transparent;border-radius:12px;padding:16px;overflow-y:auto}
      .msg-bubble{max-width:70%;padding:10px 14px;border-radius:14px;margin:8px 0;display:inline-block;word-wrap:break-word}
      .msg-bubble.own{margin-left:auto;background:linear-gradient(90deg,var(--cyan),#007b9a);color:#021213;border:none}
      .msg-bubble.other{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.04);color:#e6fbff}
      .msg-meta{font-size:12px;opacity:0.7;margin-bottom:4px}
      .msg-item{display:flex;flex-direction:column;margin-bottom:8px}
      .msg-item.own{align-items:flex-end}
      .online-user{padding:10px;background:rgba(0,212,255,0.08);border-left:3px solid var(--cyan);margin-bottom:8px;border-radius:4px;font-size:14px}
      .online-user:hover{background:rgba(0,212,255,0.15)}
      .input-area{display:flex;gap:8px;padding:12px;background:rgba(255,255,255,0.01);border-radius:8px}
      .input-area input{flex:1;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.04);color:#e6fbff}
      .btn-primary{background:var(--cyan);border-color:var(--cyan);color:#021213;font-weight:600}
      .header{display:flex;justify-content:space-between;align-items:center;padding:16px 12px;border-bottom:1px solid rgba(0,212,255,0.1)}
      .system-msg{background:rgba(0,212,255,0.05);color:#00d4ff;padding:8px 12px;border-radius:6px;margin:8px 0;font-size:13px;font-style:italic;text-align:center}
      @media(max-width:768px){.app-container{flex-direction:column;height:auto}.sidebar{width:100%;max-height:200px}}
    </style>
</head>
<body>
    <div class="header">
        <h5 class="mb-0">💬 Chat App</h5>
        <div>
            <span id="statusBadge" class="badge bg-secondary">Connecting...</span>
            <span class="badge bg-info ms-2" id="usernameBadge"></span>
            <button id="logoutBtn" class="btn btn-outline-secondary btn-sm ms-2">Logout</button>
        </div>
    </div>

    <div class="app-container">
        <div class="sidebar">
            <h6>👥 Online (<span id="onlineCount">0</span>)</h6>
            <ul id="onlineUsers" class="list-unstyled mb-0"></ul>
        </div>

        <div class="main-area">
            <div class="messages-container" id="messagesContainer"></div>
            <div class="input-area">
                <input id="messageInput" type="text" class="form-control" placeholder="Type a message..." />
                <button id="sendBtn" class="btn btn-primary">Send</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <script>
      const token = localStorage.getItem('token');
      const username = localStorage.getItem('username');
      
      if(!token || !username){ 
        window.location.href = '/login.html'; 
      }

      document.getElementById('usernameBadge').innerText = username;

      const statusBadge = document.getElementById('statusBadge');
      const messagesContainer = document.getElementById('messagesContainer');
      const onlineUsersEl = document.getElementById('onlineUsers');
      const onlineCountEl = document.getElementById('onlineCount');
      const messageInput = document.getElementById('messageInput');
      const sendBtn = document.getElementById('sendBtn');

      let stompClient = null;
      const onlineUsers = new Set();

      function setStatus(text, type='secondary'){
        statusBadge.innerText = text;
        statusBadge.className = 'badge bg-' + type;
      }

      function addMessage(msg, isSystem=false){
        const item = document.createElement('div');
        item.className = 'msg-item ' + (msg.sender === username ? 'own' : 'other');
        
        if(isSystem){
          item.innerHTML = `<div class="system-msg">${msg.content}</div>`;
        } else {
          const meta = document.createElement('div');
          meta.className = 'msg-meta';
          meta.innerText = msg.sender + (msg.timestamp ? ' • ' + new Date(msg.timestamp).toLocaleTimeString() : '');
          
          const bubble = document.createElement('div');
          bubble.className = 'msg-bubble ' + (msg.sender === username ? 'own' : 'other');
          bubble.innerText = msg.content;
          
          item.appendChild(meta);
          item.appendChild(bubble);
        }
        
        messagesContainer.appendChild(item);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      function updateOnlineUsers(users){
        onlineUsers.clear();
        onlineUsersEl.innerHTML = '';
        users.forEach(u => {
          onlineUsers.add(u);
          const li = document.createElement('li');
          li.innerHTML = `<div class="online-user">● ${u}</div>`;
          onlineUsersEl.appendChild(li);
        });
        onlineCountEl.innerText = users.length;
      }

      function sendMessage(){
        const content = messageInput.value.trim();
        if(!content || !stompClient) return;
        
        stompClient.publish({
          destination: '/app/chat.sendMessage',
          body: JSON.stringify({ sender: username, content: content, type: 'CHAT' })
        });
        messageInput.value = '';
      }

      function connectWs(){
        const client = new StompJs.Client({
          brokerURL: 'ws://localhost:8080/ws',
          debug: (str) => console.log('[STOMP]', str),
          reconnectDelay: 5000,
          heartbeatIncoming: 4000,
          heartbeatOutgoing: 4000
        });

        client.onConnect = (frame) => {
          setStatus('Connected ✓', 'success');
          stompClient = client;

          // Subscribe tin nhắn public
          stompClient.subscribe('/topic/public', (msg) => {
            const data = JSON.parse(msg.body);
            if(data.type === 'CHAT'){
              addMessage(data);
            } else if(data.type === 'JOIN'){
              addMessage({ content: `${data.sender} đã vào chat` }, true);
              onlineUsers.add(data.sender);
              updateOnlineUsers(Array.from(onlineUsers));
            } else if(data.type === 'LEAVE'){
              addMessage({ content: `${data.sender} đã rời chat` }, true);
              onlineUsers.delete(data.sender);
              updateOnlineUsers(Array.from(onlineUsers));
            }
          });

          // Load lịch sử
          stompClient.subscribe('/topic/history', (msg) => {
            const history = JSON.parse(msg.body);
            history.forEach(h => addMessage(h));
          });

          // Join room
          stompClient.publish({
            destination: '/app/chat.addUser',
            body: JSON.stringify({ sender: username, type: 'JOIN' })
          });

          // Request lịch sử
          stompClient.publish({
            destination: '/app/chat.history',
            body: JSON.stringify({ sender: username })
          });
        };

        client.onDisconnect = () => {
          setStatus('Disconnected', 'danger');
        };

        client.onStompError = (frame) => {
          console.error('STOMP error:', frame);
          setStatus('Connection Error', 'danger');
        };

        client.activate();
      }

      sendBtn.addEventListener('click', sendMessage);
      messageInput.addEventListener('keypress', (e) => {
        if(e.key === 'Enter') sendMessage();
      });

      document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('token');
        localStorage.removeItem('username');
        window.location.href = '/login.html';
      });

      // Start connection
      connectWs();
    </script>
</body>
</html>
