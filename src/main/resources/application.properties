spring.application.name=chat-app

spring.h2.console.path=/h2-console
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# H2 (dev) / default datasource
spring.datasource.url=jdbc:h2:mem:chatdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# File upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=uploads

# JWT Configuration (development default)
# Replace with a secure 32+ char secret in production via env or secrets
jwt.secret=SuperSecureJwtSecretKeyFor256BitsMinimumLengthHere!@#$%^&*()
jwt.expiration-ms=86400000